<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Счётчик 2026" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>Прогресс по периодам</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            border: 1px solid #000000;
            background: #ffffff;
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-style: solid;
            border-color: #000000;
        }

        .corner-tl { top: 30px; left: 30px; border-width: 3px 0 0 3px; }
        .corner-tr { top: 30px; right: 30px; border-width: 3px 3px 0 0; }
        .corner-bl { bottom: 30px; left: 30px; border-width: 0 0 3px 3px; }
        .corner-br { bottom: 30px; right: 30px; border-width: 0 3px 3px 0; }

        .content {
            padding: 70px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .time-section {
            margin-bottom: 40px;
            width: 100%;
        }

        .time-label {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #666666;
        }

        .time-display {
            font-size: 4.5rem;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -2px;
            font-family: 'Inter', monospace;
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: lowercase;
            color: #666666;
        }

        .since-block {
            background: #000000;
            color: #ffffff;
            border-radius: 16px;
            padding: 20px 20px;
            width: 100%;
            margin-bottom: 50px;
        }

        .since-label {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        .since-date {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        /* Сетка диаграмм: 3 в ряд на ПК, центрирование последнего ряда */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 30px;
            width: 100%;
            margin-bottom: 50px;
            border-top: 1px solid #000000;
            border-bottom: 1px solid #000000;
            padding: 45px 30px;
            justify-items: center;
            align-items: start;
        }

        .chart-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 180px;
        }

        .chart-card-placeholder {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            width: 100%;
            max-width: 180px;
        }

        .chart-canvas-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 18px;
        }

        canvas.donut-canvas {
            width: 140px;
            height: 140px;
            display: block;
        }

        .chart-label-name {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .chart-percent-number {
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.2;
        }

        /* Детальная разница — теперь каждая единица отдельно (не суммарно) */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            width: 100%;
        }

        .stat-card {
            background: #f8f8f8;
            padding: 12px 18px;
            border-radius: 20px;
            min-width: 90px;
            text-align: center;
            flex: 0 1 auto;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999999;
            width: 100%;
        }

        /* Планшеты: 2 диаграммы в ряд */
        @media (max-width: 900px) {
            .content { padding: 50px 25px; }
            .time-display { font-size: 3rem; }
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 35px 25px;
                padding: 35px 20px;
            }
            .chart-canvas-container {
                width: 130px;
                height: 130px;
            }
            canvas.donut-canvas {
                width: 130px;
                height: 130px;
            }
            .chart-percent-number { font-size: 1.6rem; }
            .stat-number { font-size: 1.3rem; }
            .stat-card { padding: 10px 14px; min-width: 80px; }
        }

        /* Мобильные: 1 диаграмма в ряд */
        @media (max-width: 600px) {
            .time-display { font-size: 2.2rem; }
            .charts-grid {
                grid-template-columns: 1fr;
                gap: 35px;
                justify-items: center;
                padding: 30px 15px;
            }
            .chart-card {
                max-width: 220px;
            }
            .chart-canvas-container {
                width: 150px;
                height: 150px;
            }
            canvas.donut-canvas {
                width: 150px;
                height: 150px;
            }
            .chart-percent-number { font-size: 1.7rem; }
            .stats-row {
                gap: 10px;
            }
            .stat-card {
                min-width: 70px;
                padding: 8px 10px;
            }
            .stat-number {
                font-size: 1.1rem;
            }
            .chart-card-placeholder {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .chart-canvas-container {
                width: 130px;
                height: 130px;
            }
            canvas.donut-canvas {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="content">
        <!-- Текущее время -->
        <div class="time-section">
            <div class="time-label">текущее время</div>
            <div class="time-display" id="currentTime">--:--:--.--</div>
            <div class="date-display" id="currentDate"></div>
        </div>

        <!-- Точка отсчёта -->
        <div class="since-block">
            <div class="since-label">начало отсчёта</div>
            <div class="since-date">25 июня 2026, 00:00:00</div>
        </div>

        <!-- Сетка диаграмм -->
        <div class="charts-grid" id="chartsGrid"></div>

        <!-- Детальная разница: теперь каждая единица отдельно -->
        <div class="stats-row" id="statsContainer"></div>

        <div class="footer">
            <span>обновление каждую миллисекунду</span> · все периоды от часа до года
        </div>
    </div>
</div>

<script>
    // ФИКСИРОВАННЫЙ СТАРТ
    const START_DATE = new Date(2026, 5, 25, 0, 0, 0, 0);
    
    // Длительности периодов в миллисекундах
    const MS_PER_SECOND = 1000;
    const MS_PER_MINUTE = 60 * MS_PER_SECOND;
    const MS_PER_HOUR = 60 * MS_PER_MINUTE;
    const MS_PER_DAY = 24 * MS_PER_HOUR;
    const MS_PER_WEEK = 7 * MS_PER_DAY;
    const MS_PER_MONTH_AVG = 30.44 * MS_PER_DAY;
    const MS_PER_3MONTHS = 3 * MS_PER_MONTH_AVG;
    const MS_PER_HALF_YEAR = 6 * MS_PER_MONTH_AVG;
    const MS_PER_YEAR = 365 * MS_PER_DAY;
    
    // Список периодов (7 штук)
    const PERIODS = [
        { id: 'hour', name: 'час', durationMs: MS_PER_HOUR },
        { id: 'day', name: 'день', durationMs: MS_PER_DAY },
        { id: 'week', name: 'неделя', durationMs: MS_PER_WEEK },
        { id: 'month', name: 'месяц', durationMs: MS_PER_MONTH_AVG },
        { id: '3months', name: '3 месяца', durationMs: MS_PER_3MONTHS },
        { id: 'halfyear', name: 'полгода', durationMs: MS_PER_HALF_YEAR },
        { id: 'year', name: 'год', durationMs: MS_PER_YEAR }
    ];
    
    function getElapsedMs() {
        const now = new Date();
        const elapsed = now - START_DATE;
        return elapsed < 0 ? 0 : elapsed;
    }
    
    // НОВАЯ ФУНКЦИЯ: возвращает прошедшее время в каждой единице ОТДЕЛЬНО (не суммарно)
    function getSeparateUnits(elapsedMs) {
        if (elapsedMs <= 0) {
            return {
                months: 0, weeks: 0, days: 0, hours: 0, minutes: 0, seconds: 0, milliseconds: 0
            };
        }
        // Каждая единица считается отдельно от общей длительности
        const months = elapsedMs / MS_PER_MONTH_AVG;
        const weeks = elapsedMs / MS_PER_WEEK;
        const days = elapsedMs / MS_PER_DAY;
        const hours = elapsedMs / MS_PER_HOUR;
        const minutes = elapsedMs / MS_PER_MINUTE;
        const seconds = elapsedMs / MS_PER_SECOND;
        const milliseconds = elapsedMs;
        
        return { months, weeks, days, hours, minutes, seconds, milliseconds };
    }
    
    function drawDonut(canvasElem, ratio) {
        if (!canvasElem || !canvasElem.getContext) return;
        const ctx = canvasElem.getContext('2d');
        const size = canvasElem.width;
        if (size === 0) return;
        
        const centerX = size / 2;
        const centerY = size / 2;
        
        let radius, lineWidth;
        if (size <= 110) {
            radius = size * 0.35;
            lineWidth = size * 0.18;
        } else if (size <= 140) {
            radius = size * 0.36;
            lineWidth = size * 0.16;
        } else {
            radius = size * 0.38;
            lineWidth = size * 0.14;
        }
        if (radius + lineWidth/2 > size/2) {
            radius = size * 0.32;
            lineWidth = size * 0.16;
        }
        
        ctx.clearRect(0, 0, size, size);
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#e6e6e6';
        ctx.lineWidth = lineWidth;
        ctx.stroke();
        
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (Math.PI * 2 * Math.min(1, Math.max(0, ratio)));
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'butt';
        ctx.stroke();
    }
    
    let chartElements = {};
    
    function initChartsGrid() {
        const gridContainer = document.getElementById('chartsGrid');
        if (!gridContainer) return;
        gridContainer.innerHTML = '';
        
        PERIODS.forEach(period => {
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.setAttribute('data-period-id', period.id);
            
            const canvasContainer = document.createElement('div');
            canvasContainer.className = 'chart-canvas-container';
            const canvas = document.createElement('canvas');
            canvas.width = 140;
            canvas.height = 140;
            canvas.className = 'donut-canvas';
            canvas.style.width = '140px';
            canvas.style.height = '140px';
            canvasContainer.appendChild(canvas);
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'chart-label-name';
            labelDiv.innerText = period.name;
            
            const percentDiv = document.createElement('div');
            percentDiv.className = 'chart-percent-number';
            percentDiv.id = `percent_${period.id}`;
            percentDiv.innerText = '0%';
            
            card.appendChild(canvasContainer);
            card.appendChild(labelDiv);
            card.appendChild(percentDiv);
            gridContainer.appendChild(card);
            
            chartElements[period.id] = { canvas, percentDiv };
        });
        
        // Плейсхолдеры для центрирования последнего ряда (3 колонки)
        const totalItems = PERIODS.length; // 7
        const columns = 3;
        const remainder = totalItems % columns;
        if (remainder !== 0) {
            const placeholdersNeeded = columns - remainder;
            for (let i = 0; i < placeholdersNeeded; i++) {
                const placeholder = document.createElement('div');
                placeholder.className = 'chart-card-placeholder';
                const innerDummy = document.createElement('div');
                innerDummy.style.width = '140px';
                innerDummy.style.height = '140px';
                innerDummy.style.visibility = 'hidden';
                placeholder.appendChild(innerDummy);
                gridContainer.appendChild(placeholder);
            }
        }
        
        adjustCanvasSizes();
    }
    
    function adjustCanvasSizes() {
        for (const period of PERIODS) {
            const elem = chartElements[period.id];
            if (elem && elem.canvas) {
                const container = elem.canvas.parentElement;
                if (container) {
                    const containerWidth = container.clientWidth;
                    if (containerWidth && containerWidth > 20) {
                        elem.canvas.width = containerWidth;
                        elem.canvas.height = containerWidth;
                        elem.canvas.style.width = `${containerWidth}px`;
                        elem.canvas.style.height = `${containerWidth}px`;
                    } else {
                        elem.canvas.width = 140;
                        elem.canvas.height = 140;
                        elem.canvas.style.width = '140px';
                        elem.canvas.style.height = '140px';
                    }
                }
            }
        }
    }
    
    function updateAllPeriodsProgress(elapsedMs) {
        for (const period of PERIODS) {
            const ratio = elapsedMs / period.durationMs;
            const percent = Math.min(100, ratio * 100);
            const ratioClamped = Math.min(1, Math.max(0, ratio));
            
            const elem = chartElements[period.id];
            if (elem) {
                elem.percentDiv.innerText = percent.toFixed(2) + '%';
                const canvas = elem.canvas;
                if (canvas) {
                    const container = canvas.parentElement;
                    if (container) {
                        const newWidth = container.clientWidth;
                        if (newWidth && newWidth > 20 && canvas.width !== newWidth) {
                            canvas.width = newWidth;
                            canvas.height = newWidth;
                            canvas.style.width = `${newWidth}px`;
                            canvas.style.height = `${newWidth}px`;
                        }
                    }
                    drawDonut(canvas, ratioClamped);
                }
            }
        }
    }
    
    let statsInitialized = false;
    function updateDetailedStats(elapsedMs) {
        const units = getSeparateUnits(elapsedMs);
        const container = document.getElementById('statsContainer');
        if (!container) return;
        
        if (!statsInitialized) {
            container.innerHTML = `
                <div class="stat-card"><div class="stat-label">месяцев</div><div class="stat-number" id="statMonths">0</div></div>
                <div class="stat-card"><div class="stat-label">недель</div><div class="stat-number" id="statWeeks">0</div></div>
                <div class="stat-card"><div class="stat-label">дней</div><div class="stat-number" id="statDays">0</div></div>
                <div class="stat-card"><div class="stat-label">часов</div><div class="stat-number" id="statHours">0</div></div>
                <div class="stat-card"><div class="stat-label">минут</div><div class="stat-number" id="statMinutes">0</div></div>
                <div class="stat-card"><div class="stat-label">секунд</div><div class="stat-number" id="statSeconds">0</div></div>
                <div class="stat-card"><div class="stat-label">мс</div><div class="stat-number" id="statMillis">0</div></div>
            `;
            statsInitialized = true;
        }
        
        // Отображаем с дробной частью для больших единиц, для секунд и мс — целые
        document.getElementById('statMonths').innerText = units.months.toFixed(4);
        document.getElementById('statWeeks').innerText = units.weeks.toFixed(4);
        document.getElementById('statDays').innerText = units.days.toFixed(4);
        document.getElementById('statHours').innerText = units.hours.toFixed(4);
        document.getElementById('statMinutes').innerText = units.minutes.toFixed(4);
        document.getElementById('statSeconds').innerText = Math.floor(units.seconds);
        document.getElementById('statMillis').innerText = Math.floor(units.milliseconds);
    }
    
    function updateCurrentTimeDisplay() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ms = String(now.getMilliseconds()).padStart(3, '0');
        const timeStr = `${hours}:${minutes}:${seconds}.${ms}`;
        const timeElem = document.getElementById('currentTime');
        if (timeElem) timeElem.innerText = timeStr;
        
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        const dateElem = document.getElementById('currentDate');
        if (dateElem) dateElem.innerText = now.toLocaleDateString('ru-RU', options);
    }
    
    function fullUpdate() {
        const elapsed = getElapsedMs();
        updateAllPeriodsProgress(elapsed);
        updateDetailedStats(elapsed);
        updateCurrentTimeDisplay();
    }
    
    let resizeTimeout;
    function handleResize() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            const gridContainer = document.getElementById('chartsGrid');
            if (gridContainer) {
                const wasInitialized = !!chartElements.hour;
                if (wasInitialized) {
                    chartElements = {};
                    initChartsGrid();
                    fullUpdate();
                }
            } else {
                adjustCanvasSizes();
                fullUpdate();
            }
        }, 150);
    }
    
    let lastColumns = 3;
    function checkAndRebuildGrid() {
        let currentColumns = 3;
        if (window.innerWidth <= 600) currentColumns = 1;
        else if (window.innerWidth <= 900) currentColumns = 2;
        else currentColumns = 3;
        
        if (currentColumns !== lastColumns) {
            lastColumns = currentColumns;
            const gridContainer = document.getElementById('chartsGrid');
            if (gridContainer) {
                chartElements = {};
                initChartsGrid();
                fullUpdate();
            }
        }
    }
    
    function init() {
        initChartsGrid();
        fullUpdate();
        
        function animationLoop() {
            fullUpdate();
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);
        
        window.addEventListener('resize', () => {
            handleResize();
            checkAndRebuildGrid();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                handleResize();
                checkAndRebuildGrid();
            }, 50);
        });
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
