<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Счётчик 2026" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
            border: 1px solid #000000;
            background: #ffffff;
        }

        /* Закрепление углов */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-style: solid;
            border-color: #000000;
        }

        .corner-tl {
            top: 30px;
            left: 30px;
            border-width: 3px 0 0 3px;
        }

        .corner-tr {
            top: 30px;
            right: 30px;
            border-width: 3px 3px 0 0;
        }

        .corner-bl {
            bottom: 30px;
            left: 30px;
            border-width: 0 0 3px 3px;
        }

        .corner-br {
            bottom: 30px;
            right: 30px;
            border-width: 0 3px 3px 0;
        }

        .content {
            padding: 70px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .time-section {
            margin-bottom: 60px;
            width: 100%;
        }

        .time-label {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #666666;
        }

        .time-display {
            font-size: 5.2rem;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -2px;
            font-family: 'Inter', monospace;
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: lowercase;
            color: #666666;
        }

        /* Главный прогресс-блок */
        .progress-main {
            margin-bottom: 50px;
            width: 100%;
            border-top: 1px solid #000000;
            border-bottom: 1px solid #000000;
            padding: 35px 0;
        }

        .progress-period {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 20px;
        }

        .progress-value {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            width: 80%;
            margin: 20px auto 0;
            height: 4px;
            background: #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #000000;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Детальная разница */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 60px;
            flex-wrap: wrap;
            width: 100%;
        }

        .stat-card {
            background: #f8f8f8;
            padding: 15px 24px;
            border-radius: 20px;
            min-width: 130px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .stat-sub {
            font-size: 0.9rem;
            font-weight: 400;
            color: #555;
        }

        /* Круговая диаграмма (полый сектор) */
        .chart-row {
            display: flex;
            justify-content: center;
            margin-bottom: 60px;
            width: 100%;
        }

        .donut-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        canvas {
            width: 200px;
            height: 200px;
            display: block;
        }

        .chart-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .chart-period-name {
            font-size: 14px;
            letter-spacing: 2px;
            color: #666666;
            text-transform: uppercase;
        }

        .chart-percent {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* Блок начала отсчёта */
        .since-block {
            background: #000000;
            color: #ffffff;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .since-label {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }

        .since-date {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999999;
            width: 100%;
        }

        @media (max-width: 900px) {
            .content {
                padding: 50px 25px;
            }
            .time-display {
                font-size: 3.8rem;
            }
            .progress-value {
                font-size: 2.2rem;
            }
            .stat-number {
                font-size: 1.4rem;
            }
            .stat-card {
                padding: 12px 18px;
                min-width: 110px;
            }
        }

        @media (max-width: 600px) {
            .time-display {
                font-size: 2.8rem;
                letter-spacing: -1px;
            }
            .stats-row {
                gap: 15px;
            }
            .stat-card {
                min-width: 100px;
                padding: 10px 12px;
            }
            .stat-number {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="content">
        <!-- Время сейчас -->
        <div class="time-section">
            <div class="time-label">текущее время</div>
            <div class="time-display" id="currentTime">--:--:--.--</div>
            <div class="date-display" id="currentDate"></div>
        </div>

        <!-- Точка отсчёта: 4 мая 2026 00:00:00 -->
        <div class="since-block">
            <div class="since-label">начало отсчёта</div>
            <div class="since-date">4 мая 2026, 00:00:00</div>
        </div>

        <!-- Динамический прогресс (день / неделя / месяц / 3м / 6м / год) -->
        <div class="progress-main">
            <div class="progress-period" id="progressPeriodLabel">прогресс периода</div>
            <div class="progress-value" id="progressPercentValue">0%</div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progressFillBar"></div>
            </div>
        </div>

        <!-- Детальные единицы времени: сколько прошло месяцев, недель, дней, часов, минут, секунд, миллисекунд -->
        <div class="stats-row" id="statsContainer">
            <!-- будут заполнены динамически -->
        </div>

        <!-- Круговая диаграмма с толстым полузаполненным сектором (donut с толстой линией) -->
        <div class="chart-row">
            <div class="donut-container">
                <canvas id="donutCanvas" width="200" height="200"></canvas>
                <div class="chart-label">
                    <div class="chart-period-name" id="donutPeriodName">прогресс</div>
                    <div class="chart-percent" id="donutPercent">0%</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span>обновление каждую миллисекунду</span> · с 4 мая 2026
        </div>
    </div>
</div>

<script>
    // ФИКСИРОВАННАЯ ДАТА СТАРТА: 4 мая 2026, 00:00:00 UTC+3 (московское время)
    // Чтобы корректно сравнивать с текущим локальным временем, используем Date с явной установкой локального времени
    // Star Date: 4 мая 2026, 00:00:00 по местному времени (системная таймзона)
    const START_DATE = new Date(2026, 4, 4, 0, 0, 0, 0); // месяцы в JS: 0-янв, 4 = май
    
    // Функция для получения прошедшего интервала в миллисекундах
    function getElapsedMs() {
        const now = new Date();
        const elapsed = now - START_DATE;
        return elapsed < 0 ? 0 : elapsed;
    }

    // Получение границ периода (в мс) на основе прошедшего времени
    // Возвращает { periodName, totalDuration, elapsed }
    // Выбираем подходящий период: если elapsed < 1 дня -> день (24ч), < 7 дней -> неделя, 
    // < 1 месяца (среднее 30.44 дня) -> месяц, < 3 месяцев -> 3 месяца, < 6 месяцев -> 6 месяцев, иначе год (365 дней)
    function getCurrentPeriodData(elapsedMs) {
        const MS_PER_SECOND = 1000;
        const MS_PER_MINUTE = 60 * MS_PER_SECOND;
        const MS_PER_HOUR = 60 * MS_PER_MINUTE;
        const MS_PER_DAY = 24 * MS_PER_HOUR;
        const MS_PER_WEEK = 7 * MS_PER_DAY;
        const MS_PER_MONTH_AVG = 30.44 * MS_PER_DAY;   // средний месяц
        const MS_PER_3MONTHS = 3 * MS_PER_MONTH_AVG;
        const MS_PER_6MONTHS = 6 * MS_PER_MONTH_AVG;
        const MS_PER_YEAR = 365 * MS_PER_DAY;

        if (elapsedMs < MS_PER_DAY) {
            return {
                periodName: "день",
                totalDuration: MS_PER_DAY,
                elapsed: elapsedMs,
                unit: "день"
            };
        } else if (elapsedMs < MS_PER_WEEK) {
            return {
                periodName: "неделя",
                totalDuration: MS_PER_WEEK,
                elapsed: elapsedMs,
                unit: "неделя"
            };
        } else if (elapsedMs < MS_PER_MONTH_AVG) {
            return {
                periodName: "месяц",
                totalDuration: MS_PER_MONTH_AVG,
                elapsed: elapsedMs,
                unit: "месяц"
            };
        } else if (elapsedMs < MS_PER_3MONTHS) {
            return {
                periodName: "3 месяца",
                totalDuration: MS_PER_3MONTHS,
                elapsed: elapsedMs,
                unit: "3мес"
            };
        } else if (elapsedMs < MS_PER_6MONTHS) {
            return {
                periodName: "6 месяцев",
                totalDuration: MS_PER_6MONTHS,
                elapsed: elapsedMs,
                unit: "6мес"
            };
        } else {
            return {
                periodName: "год",
                totalDuration: MS_PER_YEAR,
                elapsed: elapsedMs,
                unit: "год"
            };
        }
    }

    // Детальный расчет компонентов времени (сколько месяцев, недель, дней, часов, минут, секунд, миллисекунд прошло)
    function getDetailedDiff(elapsedMs) {
        const ms = elapsedMs;
        if (ms <= 0) return { months:0, weeks:0, days:0, hours:0, minutes:0, seconds:0, milliseconds:0 };

        // Месяцы: примерное количество (из полного числа дней)
        const MS_PER_DAY = 86400000;
        const totalDays = ms / MS_PER_DAY;
        const months = Math.floor(totalDays / 30.44);
        const daysAfterMonths = totalDays - months * 30.44;
        const weeks = Math.floor(daysAfterMonths / 7);
        const days = Math.floor(daysAfterMonths % 7);
        
        const remainingAfterDays = ms - (months * 30.44 * MS_PER_DAY) - (weeks * 7 * MS_PER_DAY) - (days * MS_PER_DAY);
        const hours = Math.floor(remainingAfterDays / (3600000));
        const minutes = Math.floor((remainingAfterDays % 3600000) / 60000);
        const seconds = Math.floor((remainingAfterDays % 60000) / 1000);
        const milliseconds = Math.floor(remainingAfterDays % 1000);
        
        return { months, weeks, days, hours, minutes, seconds, milliseconds };
    }

    // Обновление интерфейса (вызывается очень часто, requestAnimationFrame / setInterval(1ms) не надо, достаточно ~50fps)
    let rafId = null;
    let lastTimestamp = 0;
    
    function updateUI() {
        const elapsed = getElapsedMs();
        const periodData = getCurrentPeriodData(elapsed);
        const { periodName, totalDuration, elapsed: periodElapsed } = periodData;
        let percent = (periodElapsed / totalDuration) * 100;
        percent = Math.min(100, Math.max(0, percent));
        
        // --- текстовые элементы ---
        document.getElementById('progressPeriodLabel').innerHTML = `прогресс ${periodName}`;
        const percentFixed = percent.toFixed(4);
        document.getElementById('progressPercentValue').innerHTML = `${percentFixed}%`;
        document.getElementById('progressFillBar').style.width = `${percent}%`;
        
        // круговой диаграмме период и процент
        document.getElementById('donutPeriodName').innerHTML = periodName;
        document.getElementById('donutPercent').innerHTML = `${Math.floor(percent)}%`;
        
        // отрисовка канваса с толстым полузаполненным сектором (donut с жирной линией)
        drawDonut(percent / 100);
        
        // Детальная разница: сколько месяцев, недель, дней, часов, минут, секунд, миллисекунд прошло
        const diff = getDetailedDiff(elapsed);
        
        // Создаем или обновляем карточки в stats-row
        const statsContainer = document.getElementById('statsContainer');
        // Чтобы сократить перерисовку DOM, обновляем содержимое существующих элементов, или пересоздаем при первом запуске
        if (!statsContainer._initialized) {
            statsContainer.innerHTML = `
                <div class="stat-card"><div class="stat-label">месяцев</div><div class="stat-number" id="statMonths">0</div><div class="stat-sub"></div></div>
                <div class="stat-card"><div class="stat-label">недель</div><div class="stat-number" id="statWeeks">0</div></div>
                <div class="stat-card"><div class="stat-label">дней</div><div class="stat-number" id="statDays">0</div></div>
                <div class="stat-card"><div class="stat-label">часов</div><div class="stat-number" id="statHours">0</div></div>
                <div class="stat-card"><div class="stat-label">минут</div><div class="stat-number" id="statMinutes">0</div></div>
                <div class="stat-card"><div class="stat-label">секунд</div><div class="stat-number" id="statSeconds">0</div></div>
                <div class="stat-card"><div class="stat-label">мс</div><div class="stat-number" id="statMillis">0</div></div>
            `;
            statsContainer._initialized = true;
        } else {
            // обновляем значения
            document.getElementById('statMonths').innerText = diff.months;
            document.getElementById('statWeeks').innerText = diff.weeks;
            document.getElementById('statDays').innerText = diff.days;
            document.getElementById('statHours').innerText = diff.hours;
            document.getElementById('statMinutes').innerText = diff.minutes;
            document.getElementById('statSeconds').innerText = diff.seconds;
            document.getElementById('statMillis').innerText = diff.milliseconds;
        }
        
        // обновить текущее время и дату с миллисекундами
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ru-RU', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' }) + 
                        '.' + String(now.getMilliseconds()).padStart(3,'0');
        document.getElementById('currentTime').innerText = timeStr;
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('currentDate').innerText = now.toLocaleDateString('ru-RU', dateOptions);
    }
    
    // Функция отрисовки круговой диаграммы с пустым центром и толстым сектором (как "полузаполненный сектор")
    // Используем canvas, рисуем дугу с большой толщиной линии, создавая эффект кольца.
    function drawDonut(ratio) {
        const canvas = document.getElementById('donutCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const size = 200;
        const centerX = size/2;
        const centerY = size/2;
        const radius = 78;      // внешний радиус для линии (чтоб сектор был жирным)
        const lineWidth = 22;    // толстая линия, создающая полноценный сектор
        
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size}px`;
        
        ctx.clearRect(0, 0, size, size);
        
        // Фоновое серое кольцо (оставшаяся часть)
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#e6e6e6';
        ctx.lineWidth = lineWidth;
        ctx.stroke();
        
        // Активный сектор (прогресс)
        const startAngle = -Math.PI / 2;  // начинаем с 12 часов
        const endAngle = startAngle + (Math.PI * 2 * ratio);
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'butt';   // можно round но будет чуть выходить, оставим прямые углы
        ctx.stroke();
    }
    
    // Функция плавного обновления с привязкой к requestAnimationFrame (~60fps, с миллисекундной точностью)
    let lastFrameTime = 0;
    function animationLoop(nowMs) {
        updateUI();
        requestAnimationFrame(animationLoop);
    }
    
    // запускаем анимацию и немедленно обновляем
    requestAnimationFrame(animationLoop);
    
    // дополнительно синхронизируем время при загрузке, сразу отрисовать
    window.addEventListener('load', () => {
        updateUI();
        drawDonut(0);
    });
    
    // Корректировка при переключении вкладок не критична, но requestAnimationFrame справится
    // Также миллисекунды отображаются корректно
    
    // Для отображения данных точности: ставим обработчик для обновления заголовка документа (опционально)
    function updateTitleWithTime() {
        const elapsed = getElapsedMs();
        const diff = getDetailedDiff(elapsed);
        document.title = `+${diff.days}д ${diff.hours}ч ${diff.minutes}м ${diff.seconds}с | с 4 мая 2026`;
    }
    setInterval(() => {
        updateTitleWithTime();
    }, 500);
    updateTitleWithTime();
    
    // Также убедимся, что при первом запуске правильно инициализированы компоненты, которые могут быть не установлены
    setTimeout(() => {
        if (!document.getElementById('statMonths')) {
            // fallback на случай если предыдущая вставка не сработала
            const statsContainer = document.getElementById('statsContainer');
            if(statsContainer && !statsContainer._initialized){
                statsContainer.innerHTML = `
                    <div class="stat-card"><div class="stat-label">месяцев</div><div class="stat-number" id="statMonths">0</div></div>
                    <div class="stat-card"><div class="stat-label">недель</div><div class="stat-number" id="statWeeks">0</div></div>
                    <div class="stat-card"><div class="stat-label">дней</div><div class="stat-number" id="statDays">0</div></div>
                    <div class="stat-card"><div class="stat-label">часов</div><div class="stat-number" id="statHours">0</div></div>
                    <div class="stat-card"><div class="stat-label">минут</div><div class="stat-number" id="statMinutes">0</div></div>
                    <div class="stat-card"><div class="stat-label">секунд</div><div class="stat-number" id="statSeconds">0</div></div>
                    <div class="stat-card"><div class="stat-label">мс</div><div class="stat-number" id="statMillis">0</div></div>
                `;
                statsContainer._initialized = true;
            }
        }
    }, 10);
</script>
</body>
</html>
